services:

  db:
    image: postgres:15
    container_name: odoo_db
    restart: always
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_password
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - red_erp

  web:
    image: odoo:17.0
    container_name: odoo_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_password
    volumes:
      - odoo_web_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    networks:
      - red_erp

volumes:
  db_data:
  odoo_web_data:

networks:
  red_erp:
    driver: bridge